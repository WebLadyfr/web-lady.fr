[build]
  publish = "."

[[plugins]]
  package = "@netlify/plugin-lighthouse"

[build.processing]
  skip_processing = false

[build.processing.css]
  bundle = true
  minify = true

[build.processing.js]
  bundle = false
  minify = true

[build.processing.html]
  pretty_urls = true

# www -> non-www (301)
[[redirects]]
  from = "https://www.web-lady.fr/*"
  to = "https://web-lady.fr/:splat"
  status = 301
  force = true
